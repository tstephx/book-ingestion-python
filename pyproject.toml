[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-ingestion"
version = "0.1.0"
description = "A library for ingesting, processing, and extracting metadata from ebooks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Taylor Stephens" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
converters = [
    "pymupdf>=1.23.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "python-magic>=0.4.27",
]
nlp = [
    "nltk>=3.8.0",
    "spacy>=3.7.0",
]
embeddings = [
    "torch>=2.0.0",
    "sentence-transformers>=2.2.0,<5.3"  # 5.3+ needs torch>=2.5; Intel-mac torch wheels stop at 2.2.2,
    "numpy>=1.24.0",
]
all = [
    "book-ingestion[converters,nlp,embeddings]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
book-ingestion = "book_ingestion.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["book_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
